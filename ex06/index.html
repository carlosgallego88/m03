<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX06 - String Laboratory</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Laboratorio de Strings</h1>
    </header>

    <main>

        <section>

            <label for="texto">Introduce un texto:</label>

            <input
                type="text"
                id="texto"
                value="Anita lava la tina"
            >

            <label for="palabra">Palabra a buscar:</label>

            <input
                type="text"
                id="palabra"
                value="lava"
            >

            <button id="analizar">
                Analizar
            </button>

        </section>

        <section>
            <h2>Resultados</h2>

            <ul id="resultados"></ul>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
