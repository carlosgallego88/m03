<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX02 - Conditions</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Clasificación de notas</h1>
    </header>

    <main>

        <section>
            <label for="nota">Introduce una nota de 0 a 20:</label>

            <input
                type="number"
                id="nota"
                min="0"
                max="20"
            >

            <button id="clasificar">
                Clasificar
            </button>

            <p id="resultado"></p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
