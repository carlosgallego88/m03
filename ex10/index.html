<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX10 - Shopping Cart</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Carrito de compras</h1>
    </header>

    <main>

        <section>
            <h2>Productos disponibles</h2>

            <div id="productos"></div>
        </section>

        <section>
            <h2>Carrito</h2>

            <div id="carrito"></div>

            <h3>Resumen</h3>

            <p id="cantidad-total"></p>
            <p id="precio-total"></p>

            <button id="vaciar-carrito">
                Vaciar carrito
            </button>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
